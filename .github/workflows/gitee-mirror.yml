name: Mirror to Gitee

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Gitee repo if missing
        shell: bash
        run: |
          curl -sS -X POST "https://gitee.com/api/v5/user/repos" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"${{ secrets.GITEE_TOKEN }}\",\"name\":\"${{ github.event.repository.name }}\",\"auto_init\":false,\"private\":false}" \
            --max-time 30 >/dev/null 2>&1 || echo "WARN: create skipped (repo may already exist)"

      - name: Mirror push to Gitee
        shell: bash
        run: |
          REPO="${{ github.event.repository.name }}"
          USER="${{ secrets.GITEE_USERNAME }}"
          URL="https://${USER}:${{ secrets.GITEE_TOKEN }}@gitee.com/${USER}/${REPO}.git"
          git remote remove origin 2>/dev/null || true
          git remote add gitee "$URL"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          ok=0
          for i in 1 2 3 4 5; do
            echo "=== Mirror push attempt $i ==="
            if git push --force --prune gitee \
                 "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"; then
              ok=1
              break
            fi
            echo "attempt $i failed, retrying in 15s ..."
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Mirror push failed after 5 attempts"
            exit 1
          fi

      - name: Sync repo metadata (About/description) to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_DESC: ${{ github.event.repository.description }}
          REPO_HOME: ${{ github.event.repository.homepage }}
        run: |
          BODY=$(jq -n --arg t "$GITEE_TOKEN" --arg n "$REPO_NAME" --arg d "$REPO_DESC" --arg h "$REPO_HOME" \
            '{access_token:$t, name:$n, description:$d, homepage:$h}')
          echo "Syncing Gitee description: ${REPO_DESC}"
          curl -sS -X PATCH "https://gitee.com/api/v5/repos/${GITEE_USER}/${REPO_NAME}" \
            -H "Content-Type: application/json" -d "$BODY"
          echo
